<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in or create an account | EPRTrack</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Create an EPRTrack account to save and track your Plastic EPR planning records."><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="/">EPRTrack</a><nav class="links"><a href="/calculator/">Calculator</a><a href="/guides/epr-compliance/">EPR Guide</a><a href="/pricing/">Pricing</a></nav></div></header><main class="wrap narrow"><section class="hero compact"><div class="eyebrow">Save & track</div><h1>Your compliance workspace</h1><p class="lead">Create an account to save your calculator result and keep your company record in one place.</p></section><div class="card"><div class="tabs"><button id="loginTab" class="tab" onclick="show('login')">Sign in</button><button id="registerTab" class="tab" onclick="show('register')">Create account</button></div><form id="form" onsubmit="submitForm(event)"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@company.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"><button class="btn" type="submit" id="submit">Sign in</button><div id="msg" class="small"></div></form><p class="small">Your EPRTrack account is separate from the CPCB portal. EPRTrack is independent software, not an official filing service.</p></div></main><script>
const qs=new URLSearchParams(location.search);let mode=qs.get('mode')==='register'?'register':'login';function show(m){mode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('registerTab').classList.toggle('active',m==='register');document.getElementById('submit').textContent=m==='login'?'Sign in':'Create account';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password';document.getElementById('msg').textContent=''}
show(mode);
async function submitForm(e){e.preventDefault();let msg=document.getElementById('msg');msg.textContent='Working…';try{let r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Something went wrong');localStorage.setItem('eprtrack_token',d.token);let pending=localStorage.getItem('eprtrack_pending_calc');if(pending){window.location.href='/dashboard/?save=1'}else{window.location.href='/dashboard/'}}catch(err){msg.textContent=err.message}}
</script></body></html>
