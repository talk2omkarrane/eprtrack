<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | EPRTrack</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="EPRTrack compliance dashboard."><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="wrap"><a class="brand" href="/">EPRTrack</a><nav class="links"><a href="/calculator/">Calculator</a><a href="/guides/epr-compliance/">EPR Guide</a><button class="linkbtn" onclick="logout()">Sign out</button></nav></div></header><main class="wrap"><section class="hero compact"><div class="eyebrow">Compliance workspace</div><h1>Dashboard</h1><p class="lead" id="welcome">Loading your workspace…</p></section><div id="pending" class="notice" style="display:none"><b>Calculator result ready to save.</b> Create or select a company below to save this planning record.</div><section class="grid two"><div class="card"><h2>Company</h2><form onsubmit="createCompany(event)"><label>Legal/company name</label><input id="legalName" required placeholder="ABC Private Limited"><label>Role</label><select id="role"><option value="producer">Producer</option><option value="importer">Importer</option><option value="brand-owner">Brand Owner</option></select><label>Packaging category</label><select id="category"><option>I</option><option>II</option><option>III</option><option>IV</option></select><label>State</label><input id="state" placeholder="Maharashtra"><button class="btn" type="submit">Create company</button><div id="companyMsg" class="small"></div></form><hr><div id="companies">Loading companies…</div></div><div class="card"><h2>Compliance snapshot</h2><div id="snapshot"><p>Select a company to view its saved record.</p></div></div></section></main><script>
const pendingKey='eprtrack_pending_calc';
async function api(path,opt={}){let r=await fetch(path,{...opt,credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})}});let d=await r.json();if(r.status===401){location.href='/auth/?mode=login';throw Error('Session expired. Please sign in again.')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){try{let me=await api('/api/me');document.getElementById('welcome').textContent='Signed in as '+me.user.email;let p=localStorage.getItem(pendingKey);if(p)document.getElementById('pending').style.display='block';await loadCompanies()}catch(e){document.getElementById('welcome').textContent=e.message}}
async function loadCompanies(){let list=await api('/api/companies');let el=document.getElementById('companies');if(!list.length){el.innerHTML='<p class="small">No company yet. Create one to start tracking.</p>';return}el.innerHTML=list.map(c=>`<button class="companyRow" onclick="selectCompany('${c.id}')"><b>${escapeHtml(c.legal_name)}</b><span>${c.role.replace('-', ' ')} · Category ${c.category} · FY ${c.fy}</span></button>`).join('')}
async function createCompany(e){e.preventDefault();let msg=document.getElementById('companyMsg');msg.textContent='Saving…';try{let c=await api('/api/companies',{method:'POST',body:JSON.stringify({legal_name:legalName.value,role:role.value,category:category.value,state:state.value,fy:'2026-27'})});msg.textContent='Company created.';await savePending(c.id);await loadCompanies();selectCompany(c.id)}catch(err){msg.textContent=err.message}}
async function savePending(cid){let raw=localStorage.getItem(pendingKey);if(!raw)return;let d=JSON.parse(raw);await api('/api/compliance',{method:'PUT',body:JSON.stringify({company_id:cid,input_tonnes:d.input_tonnes,epr_target_tonnes:null,recycling_required_tonnes:null,recycled_content_rate:d.recycled_content_rate,progress_tonnes:0,rule_version:d.rule_version,source_url:d.source,verified_on:d.verified_on})});localStorage.removeItem(pendingKey);document.getElementById('pending').style.display='none'}
async function selectCompany(cid){try{if(localStorage.getItem(pendingKey))await savePending(cid);}catch(e){document.getElementById('companyMsg').textContent=e.message}let d=await api('/api/compliance?company_id='+encodeURIComponent(cid)),p=d.profile,c=d.company;let rate=p&&p.recycled_content_rate!=null?(p.recycled_content_rate*100)+'%':'Not specified';let qty=p&&p.recycled_content_rate!=null?(p.input_tonnes*p.recycled_content_rate).toFixed(2)+' tonnes':'Not specified';let progress=p?Number(p.progress_tonnes||0):0;document.getElementById('snapshot').innerHTML=`<p><b>${escapeHtml(c.legal_name)}</b><br>${c.role.replace('-', ' ')} · Category ${c.category} · FY ${c.fy}</p>${p?`<div class="metricGrid"><div class="metric"><span>Planning quantity</span><b>${Number(p.input_tonnes).toFixed(2)} t</b></div><div class="metric"><span>Recycled content rate</span><b>${rate}</b></div><div class="metric"><span>Indicative recycled content</span><b>${qty}</b></div><div class="metric"><span>Progress tracked</span><b>${progress.toFixed(2)} t</b></div></div><p class="small">Rule: ${escapeHtml(p.rule_version)} · Verified: ${escapeHtml(p.verified_on)}</p><p class="small">This saved record is a planning aid. Legal EPR target determination is not calculated here.</p>`:'<p>No calculator record saved yet for this company.</p>'}`}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}location.href='/'}init();
</script></body></html>
